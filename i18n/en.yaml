cdp_why4_title: "Your IP, Protected"
cdp_why4_desc: "NDAs welcomed. Molds and designs you pay for remain exclusively yours."
cdp_why5_title: "Fast, Hands-on Response"
cdp_why5_desc: "Replies within 24 hours, plus sample and progress photos at every milestone — you always know where your project stands."
cdp_why6_title: "Full-Service, One Partner"
cdp_why6_desc: "Design, engineering, prototyping, tooling, mass production, QC, packaging and shipping — one team from idea to delivery."
cdp_faq_title: "Frequently Asked Questions"
cdp_faq1_q: "What is the MOQ for a custom project?"
cdp_faq1_a: "For logo, color or packaging customization on existing models, we support small trial batches. New tooling (ODM) projects typically start from 1,000–3,000 units depending on category — tell us your target and we will find a workable plan."
cdp_faq2_q: "How long does development take?"
cdp_faq2_a: "Customizing an existing product takes 2–4 weeks. A full ODM project from concept to mass production typically takes 8–12 weeks, including prototyping and tooling."
cdp_faq3_q: "What does it cost to start?"
cdp_faq3_a: "Design proposals and quotations are free. Prototyping and tooling are quoted per project before any commitment — no hidden fees."
cdp_faq4_q: "Who owns the molds and designs?"
cdp_faq4_a: "You do. Any mold, tooling or design funded by you remains your exclusive property, and we are happy to work under NDA from day one."
cdp_faq5_q: "Can you handle certifications for my market?"
cdp_faq5_a: "Yes. We build to the compliance requirements of your target market — CE, FCC and RoHS for the US and Europe, PSE for Japan, KC for Korea — and coordinate testing with accredited labs as part of the project."
cdp_faq6_q: "Can I approve a sample before mass production?"
cdp_faq6_a: "Always. Prototypes and pre-production samples are built into every project — nothing goes to mass production until you have approved a physical sample."
