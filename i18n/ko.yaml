cdp_custom6: "기능 조정"
cdp_why_title: "왜 YiwuYimei와 공동 개발하는가"
cdp_why1_title: "자사 디자인 팀"
cdp_why1_desc: "디자이너와 엔지니어가 한 팀에 — 콘셉트와 공장 사이 전달 손실이 없습니다."
cdp_why2_title: "공장 직접 비용"
cdp_why2_desc: "개발에 무역 마진 없음 — 실제 엔지니어링·금형 비용만 지불합니다."
cdp_why3_title: "유연한 MOQ"
cdp_why3_desc: "로고·컬러 커스터마이즈는 소량부터; 신규 금형 프로젝트는 물량에 맞춰 설계."
cdp_why4_title: "IP 보호"
cdp_why4_desc: "NDA 환영. 고객이 비용을 지불한 금형과 디자인은 전적으로 고객의 자산입니다."
cdp_why5_title: "빠르고 밀착된 대응"
cdp_why5_desc: "24시간 이내 답변, 모든 단계에서 샘플과 진행 사진 공유 — 프로젝트 진행 상황을 항상 확인할 수 있습니다."
cdp_why6_title: "원스톱 풀서비스"
cdp_why6_desc: "디자인, 엔지니어링, 시제품, 금형, 양산, QC, 포장, 배송까지 — 아이디어에서 인도까지 한 팀이 담당합니다."
cdp_faq_title: "자주 묻는 질문"
cdp_faq1_q: "맞춤 프로젝트의 MOQ는 얼마인가요?"
cdp_faq1_a: "기존 모델의 로고·컬러·패키지 커스터마이즈는 소량 시험 주문부터 가능합니다. 신규 금형(ODM) 프로젝트는 카테고리에 따라 보통 1,000–3,000개부터 시작합니다 — 목표 물량을 알려주시면 실행 가능한 방안을 제시합니다."
cdp_faq2_q: "개발 기간은 얼마나 걸리나요?"
cdp_faq2_a: "기존 제품 커스터마이즈는 2–4주. 콘셉트부터 양산까지의 전체 ODM 프로젝트는 시제품·금형 포함 보통 8–12주 소요됩니다."
cdp_faq3_q: "시작 비용은 얼마인가요?"
cdp_faq3_a: "디자인 제안과 견적은 무료입니다. 시제품 제작과 금형 비용은 프로젝트별로 사전에 견적해 드립니다 — 숨겨진 비용은 없습니다."
cdp_faq4_q: "금형과 디자인의 소유권은 누구에게 있나요?"
cdp_faq4_a: "고객에게 있습니다. 고객이 비용을 지불한 금형·설계는 고객의 독점 자산이며, 첫날부터 NDA 체결도 가능합니다."
cdp_faq5_q: "제 시장에 필요한 인증을 처리할 수 있나요?"
cdp_faq5_a: "네. 미국·유럽의 CE, FCC, RoHS, 일본의 PSE, 한국의 KC 등 목표 시장의 규격 요건에 맞춰 제작하고, 공인 시험기관 테스트 진행까지 프로젝트의 일부로 지원합니다."
cdp_faq6_q: "양산 전에 샘플을 확인할 수 있나요?"
cdp_faq6_a: "항상 가능합니다. 프로토타입과 양산 전 샘플은 모든 프로젝트에 포함됩니다 — 실물 샘플을 승인하시기 전까지 양산은 시작하지 않습니다."
cdp_case_title: "실제 프로젝트, 처음부터 끝까지"
cdp_case_sub: "실제 배지 프로젝트 — 고객의 로고에서 납품까지."
