cdp_cap3_desc: "소형 가전을 위한 회로 설계, 부품 선정, 펌웨어 협업 및 안전 인증 대응."
cdp_cap4_title: "신속 프로토타이핑"
cdp_cap4_desc: "3D 프린팅, CNC 가공, 소프트 금형 샘플을 수일 내 제공 — 형태·치수·기능을 조기에 검증."
cdp_cap5_title: "금형 & 몰딩"
cdp_cap5_desc: "사출 금형, 지그, 파일럿 생산 검증을 자사에서 관리하여 양산 품질을 예측 가능하게."
cdp_cap6_title: "브랜딩 & 패키징"
cdp_cap6_desc: "로고 적용, 컬러 매칭, 소매 박스 디자인, 인서트 및 다국어 사용 설명서."
cdp_process_title: "공동 개발 프로세스"
cdp_process_sub: "투명한 5단계 프로세스 — 모든 단계는 고객 승인 후 진행합니다."
