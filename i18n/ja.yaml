cdp_cap4_title: "迅速プロトタイピング"
cdp_cap4_desc: "3Dプリント、CNC加工、簡易金型サンプルを数日でご提供——形状・寸法・機能を早期に検証。"
cdp_cap5_title: "金型・成形"
cdp_cap5_desc: "射出成形金型、治具、パイロット生産検証を社内で管理し、量産品質を安定させます。"
cdp_cap6_title: "ブランディング・パッケージ"
cdp_cap6_desc: "ロゴ印刷、カラーマッチング、リテールボックス、同梱物、多言語取扱説明書。"
