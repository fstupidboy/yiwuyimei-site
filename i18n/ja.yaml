# Custom Development page
cdp_hero_title: "カスタム開発を、確かな品質で。"
cdp_hero_sub: "YiwuYimeiは単なる貿易会社ではありません——製品開発パートナーです。米国・欧州・日本・韓国のバイヤー向けに幅広い製品をカスタム開発してきた実績があり、デザイン・エンジニアリングから試作、金型、量産まで全工程をサポートします。"
cdp_exp_title: "実績のあるカスタム開発"
cdp_exp_sub: "米国・欧州・日本・韓国の顧客向けに、携帯扇風機、アロマディフューザー、加湿器、モニターライト、カスタムバッジ、ライフスタイル雑貨まで、幅広い製品をカスタム開発してきました。"
