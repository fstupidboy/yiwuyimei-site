cdp_process_sub: "透明な5ステップのプロセス——各ゲートはお客様のご承認後に進みます。"
cdp_custom_title: "カスタマイズ可能な項目"
cdp_custom_sub: "既存モデルからでも、ゼロからでも——ほぼすべての要素を調整可能です。"
