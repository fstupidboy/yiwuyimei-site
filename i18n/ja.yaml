cdp_why_title: "YiwuYimeiと共同開発する理由"
cdp_why1_title: "社内デザインチーム"
cdp_why1_desc: "デザイナーとエンジニアが同じ屋根の下——コンセプトと工場の間で情報ロスがありません。"
cdp_why2_title: "工場直結コスト"
cdp_why2_desc: "開発に商社マージンなし——実際のエンジニアリング・金型コストのみ。"
cdp_why3_title: "柔軟なMOQ"
cdp_why3_desc: "ロゴ・カラーカスタムは小ロットから。新規金型プロジェクトは数量に合わせて設計。"
cdp_why4_title: "IP保護"
cdp_why4_desc: "NDA歓迎。お客様が費用を負担された金型・デザインは、お客様の専有資産です。"
cdp_why5_title: "迅速で密な対応"
cdp_why5_desc: "24時間以内の返信、各マイルストーンでサンプルと進捗写真を共有 — プロジェクトの状況をいつでも把握できます。"
cdp_why6_title: "ワンストップ・フルサービス"
cdp_why6_desc: "デザイン、エンジニアリング、試作、金型、量産、QC、梱包、出荷まで — アイデアから納品までワンチームで担当します。"
cdp_faq_title: "よくあるご質問"
cdp_faq1_q: "カスタムプロジェクトのMOQはいくつですか？"
cdp_faq1_a: "既存モデルへのロゴ・カラー・パッケージカスタムは小ロットの試験注文から可能です。新規金型（ODM）プロジェクトはカテゴリーにより通常1,000〜3,000個から——ご希望数量をお知らせいただければ実現可能なプランをご提案します。"
cdp_faq2_q: "開発期間はどのくらいですか？"
cdp_faq2_a: "既存製品のカスタマイズは2〜4週間。コンセプトから量産までのフルODMプロジェクトは、試作・金型を含め通常8〜12週間です。"
cdp_faq3_q: "初期費用はいくらですか？"
cdp_faq3_a: "デザイン提案とお見積もりは無料です。試作・金型費用はプロジェクトごとに事前にお見積もり——隠れた費用はありません。"
cdp_faq4_q: "金型とデザインの所有権は？"
cdp_faq4_a: "お客様のものです。お客様が費用を負担された金型・設計はお客様の専有財産であり、初日からNDAでの対応も可能です。"
cdp_cta_title: "製品アイデアをお持ちですか？一緒に作りましょう。"
cdp_cta_sub: "スケッチ、写真、競合製品のリンクをお送りください——開発プランとお見積もりをお返しします。"
