cdp_cap1_title: "工業デザイン"
cdp_cap1_desc: "ブランドとターゲット市場のトレンドに沿ったIDコンセプト、3Dレンダリング、CMF（色・素材・仕上げ）提案。"
cdp_cap2_title: "構造エンジニアリング"
cdp_cap2_desc: "機構設計、DFM解析、公差管理により、組立性と耐久性に優れた製品を実現。"
cdp_cap3_title: "電子回路・PCBA"
